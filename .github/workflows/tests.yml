name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      # The suite uses in-memory fakes and local transports: no secrets or paid API calls.
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest | tee pytest-output.txt
          echo "::notice title=pytest::$(tail -n 1 pytest-output.txt)"
